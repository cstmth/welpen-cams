# MediaMTX local ingest relay for the Welpen cameras (TEMPLATE).
#
# The per-camera path blocks are generated by mediamtx/render-mediamtx.mjs from
# the camera-template block below — one block per configured & enabled camera —
# and the CAMERA_*_RTSP / STREAM_QUALITY placeholders are then substituted from
# the environment into mediamtx/mediamtx.runtime.yml before MediaMTX starts.
# There is no fixed camera count: cameras are discovered as CAMERA_1_*,
# CAMERA_2_*, … numbered contiguously from 1.

logLevel: info

# Larger per-reader write queue so a momentarily slow reader (e.g. the combined
# encoder under load) does not get its frames discarded / connection reset.
writeQueueSize: 2048

# Restrict the RTSP server (loopback readers) to TCP.
rtspTransports: [tcp]

paths:
# BEGIN camera-template — repeated per configured camera; ${N} -> camera number.
#   camera-${N}:
#     source: ${CAMERA_${N}_RTSP}/h264Preview_01_${STREAM_QUALITY}
#     rtspTransport: tcp
#     sourceOnDemand: no
# END camera-template
